name: Debug build (AnyModelBot)

# Debug build of AntiGem v2.0.4 + AnyModelBot (branch anymodelbot). The debug app is ai.antidev
# ("AntiGem Dev"), so it installs next to the release ai.antigem. Never a release build here: the
# release keystore belongs to the upstream repo.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the termux-am submodule
        run: git submodule update --init --depth 1 termux-am

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          chmod +x gradlew scripts/build_all_apks.sh
          ./scripts/build_all_apks.sh

      - name: Checksums
        run: |
          sha256sum output/* > output/sha256sums.txt
          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: antigem-anymodelbot-debug
          path: output/*
